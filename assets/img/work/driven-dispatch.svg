    <g>
      <rect x="880" y="392" width="230" height="128" rx="8" fill="#e6e9ea"/>
      <rect x="880" y="392" width="230" height="14" rx="6" fill="#cfd5d6"/>
      <path d="M1096 402 h74 a16 16 0 0 1 16 16 v78 a12 12 0 0 1-12 12 h-78 z" fill="#ef6a24"/>
