      <rect x="418" y="176" width="364" height="30" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".22"/>
      <circle cx="452" cy="191" r="3.5" fill="#ef6a24"/>
      <circle cx="748" cy="191" r="3.5" fill="#ef6a24"/>
      <text x="600" y="196" font-size="13" font-weight="600" fill="#eaf2f2">Driven Dispatch Logistics Solutions</text>

      <text x="600" y="272" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-.6">Professional Truck Dispatch</text>
      <text x="600" y="326" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-.6">Built For Owner-Operators</text>

      <g font-size="14" fill="#b9cccd">
