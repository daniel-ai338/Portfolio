        <rect x="286" y="518" width="56" height="7" rx="2" fill="#b17f4c"/>
        <rect x="348" y="536" width="62" height="42" rx="3" fill="#c8924f"/>
        <rect x="348" y="536" width="62" height="7" rx="2" fill="#a97b40"/>
        <rect x="308" y="486" width="52" height="32" rx="3" fill="#d8a970"/>
        <rect x="308" y="486" width="52" height="6" rx="2" fill="#b98a55"/>
