      <rect x="-70" y="446" width="252" height="16" rx="7" fill="#f7a05a"/>
      <path d="M174 458 h62 a14 14 0 0 1 14 14 v86 a10 10 0 0 1-10 10 h-66 z" fill="#ef6a24"/>
      <rect x="188" y="472" width="46" height="32" rx="4" fill="#22343a" opacity=".82"/>
      <rect x="-70" y="566" width="320" height="8" fill="#1a262b"/>
      <circle cx="40" cy="578" r="20" fill="#12191c"/><circle cx="40" cy="578" r="7.5" fill="#3d484c"/>
      <circle cx="208" cy="578" r="20" fill="#12191c"/><circle cx="208" cy="578" r="7.5" fill="#3d484c"/>
