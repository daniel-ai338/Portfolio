    <path d="M0 700 L470 360 L760 360 L1200 700 Z" fill="url(#dd-road)"/>
    <path d="M600 372 L600 700" stroke="#7d8b8f" stroke-opacity=".35" stroke-width="3" stroke-dasharray="16 22"/>
    <path d="M470 360 L0 700" stroke="#8fa0a4" stroke-opacity=".18" stroke-width="2"/>
    <path d="M760 360 L1200 700" stroke="#8fa0a4" stroke-opacity=".18" stroke-width="2"/>

    <!-- distant trucks -->
    <g opacity=".72">
