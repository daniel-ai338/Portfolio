      <path d="M799 79 a7 7 0 0 1 14 0 v5 h-4 v-6 h-6 v6 h-4 z" fill="#ffffff"/>
      <text x="834" y="70" font-size="10.5" fill="#cfe0e0">Call Us Anytime</text>
      <text x="834" y="87" font-size="14" font-weight="700" fill="#f7a13c">+1 240-351-4843</text>

      <!-- cta -->
      <rect x="1004" y="60" width="152" height="34" rx="3" fill="#123137"/>
      <text x="1080" y="82" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Start Dispatching</text>
    </g>
