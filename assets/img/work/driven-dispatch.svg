        <text x="322" y="81" fill="#ef6a24">Home</text>
        <text x="386" y="81">Services</text>
        <text x="462" y="81">About Us</text>
        <text x="544" y="81">Equipment Types</text>
        <text x="664" y="81">Contact Us</text>
      </g>
      <rect x="320" y="106" width="42" height="3" fill="#ef6a24"/>

