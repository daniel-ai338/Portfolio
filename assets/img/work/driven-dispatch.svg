      <rect x="1082" y="404" width="16" height="112" rx="4" fill="#d9601f"/>
      <circle cx="932" cy="522" r="20" fill="#12191c"/><circle cx="932" cy="522" r="8" fill="#3d484c"/>
      <circle cx="1010" cy="522" r="20" fill="#12191c"/><circle cx="1010" cy="522" r="8" fill="#3d484c"/>
      <circle cx="1140" cy="522" r="20" fill="#12191c"/><circle cx="1140" cy="522" r="8" fill="#3d484c"/>
