      <rect x="748" y="446" width="42" height="46" rx="5" fill="#e6ebec"/>
      <circle cx="672" cy="496" r="9" fill="#0d1c20"/>
      <circle cx="760" cy="496" r="9" fill="#0d1c20"/>
      <circle cx="790" cy="470" r="26" fill="url(#dd-glow)"/>
