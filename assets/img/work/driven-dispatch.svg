      <path d="M92 66 q22 -10 44 -2 q-18 4 -30 12 z" fill="#ffffff"/>
      <path d="M92 78 q26 -8 48 0 q-22 6 -36 10 z" fill="#ef6a24"/>
      <text x="150" y="80" font-size="23" font-weight="700" fill="#ffffff">DDL</text>
      <text x="200" y="79" font-size="12" font-weight="700" fill="#ef6a24" letter-spacing="2">SOLUTIONS</text>
      <text x="150" y="92" font-size="7.5" fill="#9fbdbf" letter-spacing=".7">Driven Dispatch Logistics</text>

      <!-- nav -->
