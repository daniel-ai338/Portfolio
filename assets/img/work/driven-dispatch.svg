    <path d="M0 40 L74 40 L0 112 Z" fill="#ef6a24"/>
    <path d="M986 40 L1200 40 L1200 112 L940 112 Z" fill="#ef6a24"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
