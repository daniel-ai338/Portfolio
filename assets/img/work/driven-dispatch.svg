<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Driven Dispatch Solutions website preview">
  <defs>
    <linearGradient id="dd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2b31"/>
      <stop offset=".55" stop-color="#123a41"/>
      <stop offset="1" stop-color="#0a2126"/>
    </linearGradient>
    <linearGradient id="dd-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d43"/>
      <stop offset="1" stop-color="#141f24"/>
    </linearGradient>
    <radialGradient id="dd-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dd-haze" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#2f7d84" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2f7d84" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dd-page"><rect x="0" y="40" width="1200" height="720"/></clipPath>
  </defs>

  <!-- browser chrome -->
  <rect width="1200" height="760" fill="#0a2126"/>
  <rect width="1200" height="40" fill="#eceae4"/>
  <circle cx="24" cy="20" r="5" fill="#dd6b5f"/>
  <circle cx="42" cy="20" r="5" fill="#e2b04b"/>
  <circle cx="60" cy="20" r="5" fill="#6cbf6a"/>
  <rect x="150" y="9" width="900" height="22" rx="11" fill="#fbfaf7"/>
  <text x="172" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f">drivendispatchsolutions.com</text>
  <rect x="0" y="39" width="1200" height="1" fill="#d9d5cc"/>

  <g clip-path="url(#dd-page)">
