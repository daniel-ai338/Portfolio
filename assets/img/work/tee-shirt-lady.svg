<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Tee Shirt Lady website preview">
  <defs>
    <linearGradient id="tl-hero" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#2f9c96"/>
      <stop offset=".5" stop-color="#128e8a"/>
      <stop offset="1" stop-color="#0b7a78"/>
    </linearGradient>
    <linearGradient id="tl-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tl-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="tl-card"><rect x="126" y="176" width="948" height="424" rx="12"/></clipPath>
    <clipPath id="tl-page"><rect x="0" y="40" width="1200" height="720"/></clipPath>
  </defs>

  <!-- browser chrome -->
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect width="1200" height="40" fill="#eceae4"/>
  <circle cx="24" cy="20" r="5" fill="#dd6b5f"/>
  <circle cx="42" cy="20" r="5" fill="#e2b04b"/>
  <circle cx="60" cy="20" r="5" fill="#6cbf6a"/>
  <rect x="150" y="9" width="900" height="22" rx="11" fill="#fbfaf7"/>
  <text x="172" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9a978f">teeshirtlady.com</text>
  <rect x="0" y="39" width="1200" height="1" fill="#d9d5cc"/>

  <g clip-path="url(#tl-page)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0" y="40" width="1200" height="720" fill="#ffffff"/>

    <!-- utility bar -->
    <rect x="0" y="40" width="1200" height="30" fill="#0f9490"/>
    <g fill="#ffffff">
      <path d="M128 56 a9 9 0 0 1 18 0 v7 h-5 v-7 h-8 v7 h-5 z"/>
      <text x="152" y="60" font-size="12.5" font-weight="600">707-249-3642</text>
      <circle cx="990" cy="55" r="5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M983 64 a7 6 0 0 1 14 0" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <text x="1004" y="60" font-size="12.5">Login</text>
      <path d="M1062 50 h5 l4 15 h16 l4 -10 h-19" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="1074" cy="68" r="2.4"/><circle cx="1084" cy="68" r="2.4"/>
    </g>

    <!-- header -->
    <rect x="0" y="70" width="1200" height="66" fill="#ffffff"/>
    <rect x="0" y="136" width="1200" height="4" fill="#e5f1f0"/>

    <!-- logo -->
    <text x="128" y="100" font-size="19" font-weight="700" fill="#0f9490" letter-spacing=".5" transform="rotate(-4 128 100)">TEE SHiRT</text>
    <text x="150" y="122" font-size="20" font-weight="700" font-style="italic" font-family="Georgia, serif" fill="#b8232a" transform="rotate(-4 150 122)">Lady</text>
    <text x="203" y="90" font-size="8" fill="#0f9490">®</text>

    <!-- search -->
    <rect x="410" y="86" width="380" height="34" rx="17" fill="#ffffff" stroke="#dcdcdc"/>
    <circle cx="434" cy="103" r="5.5" fill="none" stroke="#0f9490" stroke-width="2"/>
    <path d="M438 107 l5 5" stroke="#0f9490" stroke-width="2" stroke-linecap="round"/>
    <text x="452" y="107" font-size="12.5" fill="#9b9b9b">Search for products...</text>

    <!-- burger -->
    <g fill="#0f9490">
      <rect x="1046" y="93" width="26" height="3.6" rx="1.8"/>
      <rect x="1046" y="101" width="26" height="3.6" rx="1.8"/>
      <rect x="1046" y="109" width="26" height="3.6" rx="1.8"/>
    </g>

    <!-- hero card -->
    <g clip-path="url(#tl-card)">
      <rect x="126" y="176" width="948" height="424" fill="url(#tl-hero)"/>
      <!-- folded-tees photo texture -->
      <g filter="url(#tl-blur)" opacity=".55">
        <path d="M126 200 q140 -60 300 40 q-160 90 -300 30 z" fill="url(#tl-fold)"/>
        <path d="M126 400 q180 -70 330 30 q-190 110 -330 40 z" fill="#ffffff" opacity=".1"/>
        <path d="M600 176 q180 20 260 120 q-160 70 -270 -30 z" fill="#ffffff" opacity=".09"/>
        <ellipse cx="300" cy="540" rx="220" ry="90" fill="#0a6f6c" opacity=".45"/>
        <ellipse cx="900" cy="560" rx="240" ry="100" fill="#0a6f6c" opacity=".4"/>
        <ellipse cx="760" cy="230" rx="180" ry="80" fill="#57c0b8" opacity=".35"/>
      </g>

      <!-- copy -->
      <text x="184" y="272" font-size="38" font-weight="600" fill="#ffffff" font-family="Comic Sans MS, Segoe UI, sans-serif">Submit Your Slogan For A</text>
      <text x="184" y="322" font-size="38" font-weight="600" fill="#ffffff" font-family="Comic Sans MS, Segoe UI, sans-serif">Tee Shirt.</text>

      <g font-size="13.5" fill="#ecfbfa">
        <text x="184" y="368">If you have an idea for a slogan you want to share, submit it by</text>
        <text x="184" y="392">completing the entry by pressing the &#8220;Upload Your Slogan&#8221;</text>
        <text x="184" y="416">button. Every month, a winner will be chosen who will receive a free</text>
        <text x="184" y="440">Tee-shirt with their slogan printed on it.</text>
      </g>

      <rect x="184" y="472" width="188" height="42" rx="21" fill="#ffd383"/>
      <text x="278" y="499" text-anchor="middle" font-size="14" font-weight="600" fill="#22201c">Upload Your Slogan</text>

      <!-- product card -->
      <rect x="760" y="212" width="230" height="300" rx="4" fill="#ffffff"/>
      <g stroke="#e8e8e6" stroke-width="1">
        <path d="M760 250 h230"/><path d="M760 300 h230"/><path d="M760 350 h230"/>
        <path d="M760 400 h230"/><path d="M760 450 h230"/>
      </g>
      <!-- hanger -->
      <path d="M875 244 a9 9 0 1 1 9 9 v8" fill="none" stroke="#a9a29a" stroke-width="2.6"/>
      <path d="M812 288 l63 -27 l63 27" fill="none" stroke="#c79a5e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- long sleeve tee -->
      <path d="M840 284 q35 16 70 0 l34 14 l-14 44 l-16 -6 l0 128 h-78 l0 -128 l-16 6 l-14 -44 z" fill="#1d1c1c"/>
      <g text-anchor="middle" fill="#f4e6c8">
        <text x="875" y="352" font-size="15" font-weight="700" font-family="Georgia, serif" letter-spacing=".5">LIFE IS</text>
        <text x="875" y="374" font-size="19" font-weight="700" font-family="Georgia, serif" letter-spacing=".5">BETTER</text>
        <text x="875" y="392" font-size="12" font-style="italic" font-family="Georgia, serif">with a</text>
        <text x="875" y="440" font-size="20" font-weight="700" font-family="Georgia, serif" letter-spacing="1">BOOK</text>
      </g>
      <path d="M846 400 q29 -10 29 4 q0 -14 29 -4 l0 18 q-29 -8 -29 4 q0 -12 -29 -4 z" fill="none" stroke="#f4e6c8" stroke-width="2"/>
    </g>

    <!-- carousel dots -->
    <circle cx="588" cy="628" r="6" fill="#a8dcd8"/>
    <circle cx="612" cy="628" r="6" fill="#0f9490"/>
  </g>
</svg>
